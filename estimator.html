<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signage Estimator | S S SIGN</title>
    <meta name="description" content="Estimate custom signage pricing for S S SIGN stainless steel nameplates, letters, acrylic nameplates, granite boards, and marble engraving.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estimator.css">
</head>
<body>
    <main class="relative min-h-screen overflow-hidden px-4 py-20">
        <div class="absolute inset-0 -z-10 bg-[linear-gradient(120deg,rgba(5,5,5,0.94),rgba(5,5,5,0.72)),url('latestscroll/goldResidency.jpeg')] bg-cover bg-center"></div>
        <button id="themeToggle" type="button" aria-label="Switch to day mode" title="Switch theme" class="theme-toggle absolute right-4 top-4 z-10 rounded-xl border border-white/20 bg-white/10 shadow-lg backdrop-blur transition-all hover:bg-white/20 md:right-5 md:top-5">
            <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"></circle>
                <path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
            </svg>
            <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 14.5A7.8 7.8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
        </button>

        <section class="mx-auto w-full max-w-6xl">
            <a href="index.html" class="inline-flex text-sm font-semibold uppercase tracking-[0.16em] text-amber-400 hover:text-amber-300">S S SIGN</a>
            <div class="mt-8 glass w-full max-w-2xl rounded-2xl p-5 shadow-2xl md:p-7">
                <div class="mb-5 flex flex-col gap-1">
                    <h1 class="text-3xl font-bold md:text-4xl">Signage Estimator</h1>
                    <p class="text-sm text-gray-400">Instant quote for custom signage sizes.</p>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                    <!-- ① Material -->
                    <label>
                        <span class="mb-2 block text-sm font-semibold text-gray-300">Material</span>
                        <select id="material" class="form-control w-full rounded-lg px-4 py-3">
                            <option value="silver">Silver Stainless Steel</option>
                            <option value="gold">Gold Stainless Steel</option>
                            <option value="rosegold">Rose Gold Stainless Steel</option>
                            <option value="acrylic">Acrylic</option>
                            <option value="stone">Stone</option>
                        </select>
                    </label>

                    <!-- ② Product — rebuilt dynamically on material change -->
                    <label>
                        <span class="mb-2 block text-sm font-semibold text-gray-300">Product</span>
                        <select id="product" class="form-control w-full rounded-lg px-4 py-3"></select>
                    </label>

                    <!-- ③ Length -->
                    <label>
                        <span class="mb-2 block text-sm font-semibold text-gray-300">Length (Horizontal)</span>
                        <input id="length" type="number" min="0" step="0.01" value="12" class="form-control w-full rounded-lg px-4 py-3" aria-label="Length">
                    </label>

                    <!-- ④ Height -->
                    <label>
                        <span class="mb-2 block text-sm font-semibold text-gray-300">Height (Vertical)</span>
                        <input id="height" type="number" min="0" step="0.01" value="12" class="form-control w-full rounded-lg px-4 py-3" aria-label="Height">
                    </label>

                    <!-- ⑤ Unit — full row -->
                    <label class="sm:col-span-2">
                        <span class="mb-2 block text-sm font-semibold text-gray-300">Measurement Unit</span>
                        <select id="unit" class="form-control w-full rounded-lg px-4 py-3">
                            <option value="in">inch</option>
                            <option value="mm">mm</option>
                            <option value="cm">cm</option>
                            <option value="ft">feet</option>
                            <option value="m">m</option>
                        </select>
                    </label>
                </div>

                <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0 flex-1">
                        <span class="block text-sm text-gray-400">Estimated Quote</span>
                        <strong id="quote" class="block whitespace-nowrap text-3xl font-bold text-white md:text-4xl">Rs 1,000</strong>
                    </div>
                    <div class="flex w-full flex-col gap-2 sm:w-auto sm:min-w-44">
                        <a id="previewProducts" href="preview.html?material=ss-nameplate-silver" class="inline-flex items-center justify-center whitespace-nowrap rounded-lg border border-white/20 bg-white/10 px-3 py-2 text-sm font-semibold text-white shadow-lg transition-all hover:bg-white/20">Preview products</a>
                        <a id="createOwnPlate" href="miniCanvas.html?material=ss-nameplate-silver&width=12&height=12&unit=in" class="inline-flex items-center justify-center whitespace-nowrap rounded-lg bg-amber-500 px-3 py-2 text-sm font-semibold text-black shadow-lg transition-all hover:bg-amber-400">Create your own plate</a>
                        <a id="whatsappQuote" href="https://wa.me/918332099014" class="inline-flex items-center justify-center whitespace-nowrap rounded-lg bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-lg transition-all hover:bg-green-700">Send quote on WhatsApp</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- ── Photo Gallery Slider ─────────────────────────────────── -->
        <section class="mx-auto w-full max-w-6xl">
            <div class="pg-section" id="gallerySection">
                <p class="pg-label">Photo Gallery</p>
                <h2 class="pg-title" id="pgTitle">Silver Nameplates Engraved</h2>

                <div class="pg-card" id="pgCard">
                    <!-- Image viewport -->
                    <div class="pg-viewport" id="pgViewport">
                        <div class="pg-overlay-top"></div>
                        <span class="pg-counter" id="pgCounter">1 / 1</span>
                        <button class="pg-arrow prev" id="pgPrev" aria-label="Previous photo">&#8249;</button>
                        <button class="pg-arrow next" id="pgNext" aria-label="Next photo">&#8250;</button>
                        <!-- images injected here -->
                    </div>

                    <!-- Bottom strip: dots + view-all -->
                    <div class="pg-info">
                        <div class="pg-dots" id="pgDots"></div>
                        <a class="pg-view-all" id="pgViewAll" href="preview.html?material=ss-nameplate-silver" target="_blank">
                            View all photos →
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script>
        // ── Products grouped by material ───────────────────────────────────────
        const MATERIAL_PRODUCTS = {
            silver: [
                { value: 'ss-nameplate-silver',    label: 'Nameplate — Engraved' },
                { value: 'ss-nameplate-silver_em', label: 'Nameplate — Embossed' },
                { value: 'ss-nameplate-silver-LED',label: 'Nameplate with LED' },
                { value: 'ss-letters-silver',      label: 'Cut-out Letters' },
                { value: 'ss-letters-silver-LED',  label: 'Cut-out Letters with LED' }
            ],
            gold: [
                { value: 'ss-nameplate-gold',      label: 'Nameplate — Engraved' },
                { value: 'ss-nameplate-gold_em',   label: 'Nameplate — Embossed' },
                { value: 'ss-nameplate-gold-LED',  label: 'Nameplate with LED' },
                { value: 'ss-letters-gold',        label: 'Cut-out Letters' },
                { value: 'ss-letters-gold-LED',    label: 'Cut-out Letters with LED' }
            ],
            rosegold: [
                { value: 'ss-nameplate-rosegold',    label: 'Nameplate — Engraved' },
                { value: 'ss-nameplate-rosegold_em', label: 'Nameplate — Embossed' },
                { value: 'ss-letters-rosegold',      label: 'Cut-out Letters' }
            ],
            acrylic: [
                { value: 'acrylic-nameplate', label: 'Acrylic 8mm Nameplate' }
            ],
            stone: [
                { value: 'granite-board',    label: 'Black Granite — Engraved' },
                { value: 'granite-board-em', label: 'Black Granite — Embossed' },
                { value: 'white-board',      label: 'White Marble — Engraved' }
            ]
        };

        // ── Per-product rates (price per sq inch) ─────────────────────────────
        const materialRates = {
            'ss-nameplate-silver':      { label: 'SS Silver Nameplate Engraved',        rate: 1150 / 144 },
            'ss-nameplate-silver_em':   { label: 'SS Silver Nameplate Embossed',        rate: 1350 / 144 },
            'ss-nameplate-silver-LED':  { label: 'SS Silver Nameplate with LED',        rate: 1800 / 144 },
            'ss-letters-silver':        { label: 'SS Silver Cut-out Letters',           rate: 540  / 60  },
            'ss-letters-silver-LED':    { label: 'SS Silver Cut-out Letters with LED',  rate: 800  / 60  },
            'ss-nameplate-gold':        { label: 'SS Gold Nameplate Engraved',          rate: 1500 / 108 },
            'ss-nameplate-gold_em':     { label: 'SS Gold Nameplate Embossed',          rate: 1850 / 108 },
            'ss-nameplate-gold-LED':    { label: 'SS Gold Nameplate with LED',          rate: 2450 / 60  },
            'ss-letters-gold':          { label: 'SS Gold Cut-out Letters',             rate: 760  / 60  },
            'ss-letters-gold-LED':      { label: 'SS Gold Cut-out Letters with LED',    rate: 1250 / 60  },
            'ss-nameplate-rosegold':    { label: 'SS Rose Gold Nameplate Engraved',     rate: (1150 / 144) * 2 },
            'ss-nameplate-rosegold_em': { label: 'SS Rose Gold Nameplate Embossed',     rate: (1350 / 144) * 2 },
            'ss-letters-rosegold':      { label: 'SS Rose Gold Cut-out Letters',        rate: (540  / 60)  * 2 },
            'acrylic-nameplate':        { label: 'Acrylic 8mm Nameplate',               rate: 1500 / 144 },
            'granite-board':            { label: 'Black Granite Engraved Board',        rate: 1000 / 144 },
            'granite-board-em':         { label: 'Black Granite Embossed Board',        rate: 800  / 144 },
            'white-board':              { label: 'White Marble Engraved Board',         rate: 1200 / 144 }
        };

        const unitToInches = { mm: 1 / 25.4, cm: 1 / 2.54, m: 39.37007874, in: 1, ft: 12 };

        const materialInput   = document.getElementById('material');
        const productInput    = document.getElementById('product');
        const lengthInput     = document.getElementById('length');
        const heightInput     = document.getElementById('height');
        const unitInput       = document.getElementById('unit');
        const quoteOutput     = document.getElementById('quote');
        const whatsappQuote   = document.getElementById('whatsappQuote');
        const previewProducts = document.getElementById('previewProducts');
        const createOwnPlate  = document.getElementById('createOwnPlate');
        const themeToggle     = document.getElementById('themeToggle');

        // ── Rebuild Product dropdown when Material changes ─────────────────────
        function rebuildProducts() {
            const mat = materialInput.value;
            const products = MATERIAL_PRODUCTS[mat] || [];
            productInput.innerHTML = products
                .map(p => `<option value="${p.value}">${p.label}</option>`)
                .join('');
            updateQuote();
        }

        function formatQuote(value) {
            return `Rs ${Math.round(value).toLocaleString('en-IN')}`;
        }

        function updateQuote() {
            const selectedProduct = materialRates[productInput.value];
            if (!selectedProduct) return;
            const length = Math.max(Number(lengthInput.value) || 0, 0);
            const height = Math.max(Number(heightInput.value) || 0, 0);
            const unit   = unitInput.value;
            const li = length * unitToInches[unit];
            const hi = height * unitToInches[unit];
            const quote = li * hi * selectedProduct.rate;
            const fq = formatQuote(quote);
            const msg = `Hi S S SIGN,\nI need a quote for ${selectedProduct.label}.\nSize: ${length} ${unit} x ${height} ${unit}.\nEstimated quote: ${fq}.`;
            quoteOutput.textContent = fq;
            whatsappQuote.href   = `https://wa.me/918332099014?text=${encodeURIComponent(msg)}`;
            previewProducts.href = `preview.html?material=${encodeURIComponent(productInput.value)}`;
            createOwnPlate.href  = `miniCanvas.html?material=${encodeURIComponent(productInput.value)}&width=${encodeURIComponent(length)}&height=${encodeURIComponent(height)}&unit=${encodeURIComponent(unit)}`;
        }

        materialInput.addEventListener('change', rebuildProducts);
        [productInput, lengthInput, heightInput, unitInput].forEach(f => {
            f.addEventListener('input', updateQuote);
            f.addEventListener('change', updateQuote);
        });

        // ── Gallery catalog (mirrors preview.html) ────────────────────────────
        const galleryCatalog = {
            'ss-nameplate-silver': { title: 'Silver Nameplates — Engraved', images: ['images/SilverNameplates/20170219_151128.jpg','images/SilverNameplates/20180405_123602.jpg','images/SilverNameplates/20180831_205652.jpg','images/SilverNameplates/20180918_144330.jpg','images/SilverNameplates/IMG_20240210_173956.jpg','images/SilverNameplates/IMG_20240625_162932.jpg','images/SilverNameplates/IMG_20240808_182031.jpg','images/SilverNameplates/IMG_20240925_163732.jpg','images/SilverNameplates/IMG_20241017_131718.jpg','images/SilverNameplates/IMG_20250211_081851.jpg','images/SilverNameplates/ssnameplate.jpg','images/SilverNameplates/teluguSSNameplate.jpg','images/residentail%20Nameplates/ssnameplate.jpg','images/residentail%20Nameplates/teluguSSNameplate.jpg'] },
            'ss-nameplate-silver_em': { title: 'Silver Nameplates — Embossed', images: ['images/SilverNameplates/Firefly%20%281%29.jpg','images/residentail%20Nameplates/Firefly.jpg','images/SilverNameplates/20180704_130511.jpg','images/SilverNameplates/20180317_115122.jpg','images/SilverNameplates/20171208_174128.jpg','images/SilverNameplates/raziaSSNameplate.jpeg','images/SilverNameplates/nameplateDesugn.jpeg'] },
            'ss-nameplate-silver-LED': { title: 'Silver Nameplates — With LED', images: [] },
            'ss-letters-silver': { title: 'Silver SS Cut-out Letters', images: ['images/SilverNameplates/mashallah.jpeg','images/silverLetters/20170514_122827.jpg','images/silverLetters/20180106_154419.jpg','images/silverLetters/20180526_122907.jpg','images/silverLetters/20180527_223942.jpg','images/silverLetters/IMG_20240716_125402.jpg','images/silverLetters/IMG_20240825_185829.jpg','images/silverLetters/IMG_20250225_130536.jpg','images/silverLetters/IMG_20250322_160001.jpg','images/silverLetters/IMG_20250407_193007.jpg','images/silverLetters/IMG_20250823_154001.jpg','images/silverLetters/IMG_20260220_160935.jpg','images/silverLetters/renukaSSletters.jpeg','images/silverLetters/shankuSSletters.jpeg'] },
            'ss-letters-silver-LED': { title: 'Silver Letters — With LED', images: ['images/silverLetters/ledurduLetters.jpeg'] },
            'ss-nameplate-gold': { title: 'Gold Nameplates — Engraved', images: ['images/GoldNameplates/goldNamePlate.png','images/GoldNameplates/GoldSSNameplate.jpeg','images/GoldNameplates/IMG_20250205_154218.jpg','images/GoldNameplates/IMG_20250216_172609.jpg','images/GoldNameplates/IMG_20250305_144336.jpg','images/GoldNameplates/srGoldSS.jpeg','images/SilverNameplates/IMG_20240615_102033.jpg','images/SilverNameplates/IMG_20250814_135355.jpg','images/SilverNameplates/IMG_20250814_143211.jpg'] },
            'ss-nameplate-gold_em': { title: 'Gold Nameplates — Embossed', images: [] },
            'ss-nameplate-gold-LED': { title: 'Gold Nameplates — With LED', images: ['images/GoldNameplates/Screenshot_2025-08-13-16-16-00-324_com.whatsapp.jpg','images/GoldNameplates/GoldSSLIGHTNameplate.jpeg','images/SilverNameplates/IMG_20250903_183904.jpg'] },
            'ss-letters-gold': { title: 'Gold SS Cut-out Letters', images: ['images/goldLetters/20180927_162156.jpg','images/goldLetters/20181125_110910.jpg','images/goldLetters/goldLetters.jpeg','images/goldLetters/IMG_20240101_180829.jpg','images/goldLetters/IMG_20240302_160519.jpg','images/goldLetters/IMG_20240826_180905.jpg','images/goldLetters/IMG_20250618_150517.jpg','images/goldLetters/IMG_20250802_175856.jpg','images/goldLetters/IMG_20250804_132928.jpg','images/goldLetters/IMG_20260218_150127.jpg','images/goldLetters/muhammedGoldLetters.jpeg','images/goldLetters/residGoldLetters.jpeg'] },
            'ss-letters-gold-LED': { title: 'Gold Letters — With LED', images: ['images/goldLEDLetters/IMG_20230609_193830.jpg','images/goldLEDLetters/IMG_20250923_210754.jpg','images/goldLEDLetters/IMG_20250923_210811.jpg','images/goldLEDLetters/IMG_20250923_211231.jpg'] },
            'ss-nameplate-rosegold': { title: 'Rose Gold Nameplates — Engraved', images: [] },
            'ss-nameplate-rosegold_em': { title: 'Rose Gold Nameplates — Embossed', images: [] },
            'ss-letters-rosegold': { title: 'Rose Gold Cut-out Letters', images: [] },
            'acrylic-nameplate': { title: 'Acrylic 8mm Nameplates', images: ['images/acrylicNameplate/acrylicNamplate.jpeg','images/acrylicNameplate/IMG_20230107_134741.jpg','images/acrylicNameplate/IMG_20240422_171858.jpg','images/acrylicNameplate/IMG_20240424_193027.jpg','images/acrylicNameplate/IMG_20240718_173421.jpg','images/acrylicNameplate/IMG_20240809_170140.jpg','images/acrylicNameplate/IMG_20241128_165630.jpg','images/acrylicNameplate/IMG_20250910_114736.jpg','images/acrylicNameplate/IMG_20250921_124244.jpg','images/fixPrice/acrylicMashallahNameplate.jpeg'] },
            'granite-board': { title: 'Black Granite — Engraved', images: ['images/stone/IMG_20250716_203721.jpg','images/stone/IMG_20250716_203730.jpg','images/stone/Screenshot_2025-06-20-20-59-42-616_com.whatsapp.w4b.jpg'] },
            'granite-board-em': { title: 'Black Granite — Embossed', images: ['images/stone/blackGrinite.jpeg','images/stone/graveNameplate.jpeg','images/stone/IMG_20190215_190552.jpg','images/stone/IMG_20250128_173045.jpg','images/stone/IMG_20250228_122300.jpg','images/stone/IMG_20250228_122308.jpg','images/stone/IMG_20250228_122422.jpg','images/stone/IMG_20250228_122510.jpg','images/stone/IMG_20260501_163927.jpg','images/stone/Screenshot_2025-06-16-17-13-52-110_com.whatsapp.jpg'] },
            'white-board': { title: 'White Marble — Engraved', images: [] }
        };

        // ── Slider state ──────────────────────────────────────────────────────
        let pgImages = [], pgCurrent = 0, pgTimer = null;

        const pgViewport = document.getElementById('pgViewport');
        const pgCounter  = document.getElementById('pgCounter');
        const pgDotsEl   = document.getElementById('pgDots');
        const pgViewAll  = document.getElementById('pgViewAll');
        const pgTitleEl  = document.getElementById('pgTitle');
        const pgPrev     = document.getElementById('pgPrev');
        const pgNext     = document.getElementById('pgNext');

        function pgGoTo(idx) {
            const all = pgViewport.querySelectorAll('.pg-img');
            if (!all.length) return;
            pgCurrent = (idx + pgImages.length) % pgImages.length;
            all.forEach((img, i) => img.classList.toggle('active', i === pgCurrent));
            pgCounter.textContent = `${pgCurrent + 1} / ${pgImages.length}`;
            pgDotsEl.querySelectorAll('.pg-dot').forEach((d, i) => d.classList.toggle('active', i === pgCurrent));
        }

        function pgStartAuto() {
            clearInterval(pgTimer);
            if (pgImages.length > 1) pgTimer = setInterval(() => pgGoTo(pgCurrent + 1), 4800);
        }

        function buildGallery(productKey) {
            clearInterval(pgTimer);
            const entry = galleryCatalog[productKey] || { title: '', images: [] };
            pgImages = entry.images;
            pgTitleEl.textContent = entry.title;
            pgViewAll.href = `preview.html?material=${encodeURIComponent(productKey)}`;

            // Show/hide arrows
            pgPrev.style.display = pgImages.length > 1 ? 'flex' : 'none';
            pgNext.style.display = pgImages.length > 1 ? 'flex' : 'none';

            // Clear old images
            pgViewport.querySelectorAll('.pg-img').forEach(el => el.remove());

            if (!pgImages.length) {
                // Empty state
                const emp = document.createElement('div');
                emp.className = 'pg-empty';
                emp.innerHTML = '<span style="font-size:2.5rem">📷</span><span>No photos yet for this product</span>';
                pgViewport.appendChild(emp);
                pgCounter.textContent = '';
                pgDotsEl.innerHTML = '';
                return;
            }

            // Remove any empty state
            pgViewport.querySelectorAll('.pg-empty').forEach(el => el.remove());

            // Build images
            pgImages.forEach((src, i) => {
                const img = document.createElement('img');
                img.className = 'pg-img' + (i === 0 ? ' active' : '');
                img.src = src;
                img.alt = entry.title + ' photo ' + (i + 1);
                img.loading = 'lazy';
                pgViewport.appendChild(img);
            });

            // Build dots (max 12 visible dots)
            const dotCount = Math.min(pgImages.length, 12);
            pgDotsEl.innerHTML = Array.from({ length: dotCount }, (_, i) =>
                `<button class="pg-dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="Photo ${i+1}"></button>`
            ).join('');
            pgDotsEl.querySelectorAll('.pg-dot').forEach(d =>
                d.addEventListener('click', () => { pgGoTo(Number(d.dataset.i)); pgStartAuto(); })
            );

            pgCurrent = 0;
            pgCounter.textContent = `1 / ${pgImages.length}`;
            pgStartAuto();
        }

        pgPrev.addEventListener('click', () => { pgGoTo(pgCurrent - 1); pgStartAuto(); });
        pgNext.addEventListener('click', () => { pgGoTo(pgCurrent + 1); pgStartAuto(); });

        // Touch / swipe support
        let pgTouchX = null;
        pgViewport.addEventListener('touchstart', e => { pgTouchX = e.touches[0].clientX; }, { passive: true });
        pgViewport.addEventListener('touchend', e => {
            if (pgTouchX === null) return;
            const dx = e.changedTouches[0].clientX - pgTouchX;
            if (Math.abs(dx) > 40) { pgGoTo(dx < 0 ? pgCurrent + 1 : pgCurrent - 1); pgStartAuto(); }
            pgTouchX = null;
        }, { passive: true });

        // Pause on hover
        pgViewport.addEventListener('mouseenter', () => clearInterval(pgTimer));
        pgViewport.addEventListener('mouseleave', pgStartAuto);

        // Rebuild gallery whenever product changes
        productInput.addEventListener('change', () => buildGallery(productInput.value));

        themeToggle.addEventListener('click', () => {

            const isDayMode = document.body.classList.toggle('day-mode');
            themeToggle.setAttribute('aria-label', isDayMode ? 'Switch to night mode' : 'Switch to day mode');
            themeToggle.classList.remove('slide');
            void themeToggle.offsetWidth;
            themeToggle.classList.add('slide');
        });

        // Initialise on page load
        rebuildProducts();
        buildGallery(productInput.value);
    </script>
</body>
</html>
